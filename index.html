<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Hook - Review & Teaser Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcf9f2; /* Warna kertas hangat */
            color: #334155;
        }
        .font-serif-custom {
            font-family: 'Merriweather', serif;
        }
        /* Loader animation */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #d97706; /* amber-600 */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        .loader-sm {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #d97706;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            // State management for multi-step process
            const [step, setStep] = useState('search'); // 'search' | 'results' | 'content'
            const [searchQuery, setSearchQuery] = useState("");
            const [searchResults, setSearchResults] = useState([]);
            const [selectedBook, setSelectedBook] = useState(null);
            
            const [isLoadingSearch, setIsLoadingSearch] = useState(false);
            const [isLoadingContent, setIsLoadingContent] = useState(false);
            const [data, setData] = useState(null);
            const [error, setError] = useState("");
            const [copiedId, setCopiedId] = useState(null);
            const [includeLinks, setIncludeLinks] = useState(false); // State untuk ceklis link
            const [selectedReviewIndices, setSelectedReviewIndices] = useState([0]); // Menyimpan index review yg dipilih untuk poster

            // State Provider & API Settings
            const [provider, setProvider] = useState(localStorage.getItem('llm_provider') || 'gemini'); // 'gemini' | 'openai'
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key') || '');
            const [geminiModel, setGeminiModel] = useState(localStorage.getItem('gemini_model') || 'gemini-1.5-flash-latest');
            
            // OpenAI Compatible States
            const [openaiEndpoint, setOpenaiEndpoint] = useState(localStorage.getItem('openai_endpoint') || 'https://api.openai.com/v1');
            const [openaiApiKey, setOpenaiApiKey] = useState(localStorage.getItem('openai_api_key') || '');
            const [openaiModel, setOpenaiModel] = useState(localStorage.getItem('openai_model') || '');
            const [openaiModelsList, setOpenaiModelsList] = useState([]);
            const [isFetchingModels, setIsFetchingModels] = useState(false);

            const [showApiSettings, setShowApiSettings] = useState(
                (!localStorage.getItem('gemini_api_key') && !localStorage.getItem('openai_api_key'))
            );

            // State baru untuk Fitur Input Manual
            const [showManualForm, setShowManualForm] = useState(false);
            const [manualTitle, setManualTitle] = useState("");
            const [manualAuthor, setManualAuthor] = useState("");

            const saveSettings = () => {
                localStorage.setItem('llm_provider', provider);
                if (provider === 'gemini') {
                    localStorage.setItem('gemini_api_key', apiKey);
                    localStorage.setItem('gemini_model', geminiModel);
                } else {
                    localStorage.setItem('openai_endpoint', openaiEndpoint);
                    localStorage.setItem('openai_api_key', openaiApiKey);
                    localStorage.setItem('openai_model', openaiModel);
                }
                setShowApiSettings(false);
            };

            const fetchOpenAIModels = async () => {
                if (!openaiEndpoint) return;
                setIsFetchingModels(true);
                try {
                    let baseUrl = openaiEndpoint.replace(/\/$/, ''); // hapus trailing slash
                    // Koreksi otomatis jika user keliru memasukkan full completion URL
                    if (baseUrl.endsWith('/chat/completions')) {
                        baseUrl = baseUrl.replace('/chat/completions', '');
                        setOpenaiEndpoint(baseUrl); // Update form input agar benar
                    }
                    const res = await fetch(`${baseUrl}/models`, {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${openaiApiKey}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    if (!res.ok) throw new Error("Gagal menarik data model. Cek API Key atau CORS.");
                    const data = await res.json();
                    if (data && data.data && Array.isArray(data.data)) {
                        setOpenaiModelsList(data.data);
                        if (data.data.length > 0 && !openaiModel) {
                            setOpenaiModel(data.data[0].id);
                        }
                    } else {
                        alert("Format respon endpoint tidak sesuai standar OpenAI.");
                    }
                } catch (err) {
                    console.error(err);
                    alert("Gagal memuat model (Mungkin diblokir CORS browser): " + err.message + "\n\nAnda tetap bisa mengetikkan nama model secara manual.");
                } finally {
                    setIsFetchingModels(false);
                }
            };

            const searchGoogleBooks = async (e) => {
                e.preventDefault();
                if (!searchQuery.trim()) {
                    setError("Silakan masukkan judul buku terlebih dahulu.");
                    return;
                }

                setIsLoadingSearch(true);
                setError("");
                setSearchResults([]);
                setStep('search'); // Keep at search while loading

                try {
                    let items = [];
                    
                    // First attempt: Google Books API
                    const response = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(searchQuery)}&maxResults=5`);
                    
                    if (response.ok) {
                        const result = await response.json();
                        items = result.items || [];
                    } else {
                        console.warn("Google Books API gagal, beralih ke OpenLibrary API...");
                        // Fallback: OpenLibrary API
                        const fallbackResponse = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(searchQuery)}&limit=5`);
                        
                        if (!fallbackResponse.ok) {
                            throw new Error("Gagal mengambil data dari semua server pencarian buku.");
                        }
                        
                        const fallbackResult = await fallbackResponse.json();
                        if (fallbackResult.docs && fallbackResult.docs.length > 0) {
                            // Menyamakan format data OpenLibrary agar cocok dengan struktur Google Books
                            items = fallbackResult.docs.map(doc => ({
                                id: doc.key,
                                volumeInfo: {
                                    title: doc.title,
                                    authors: doc.author_name || ["Penulis Tidak Diketahui"],
                                    publishedDate: doc.first_publish_year ? String(doc.first_publish_year) : '',
                                    imageLinks: doc.cover_i ? { thumbnail: `https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg` } : null,
                                    pageCount: doc.number_of_pages_median || null
                                }
                            }));
                        }
                    }

                    if (items.length > 0) {
                        setSearchResults(items);
                        setStep('results');
                    } else {
                        setError("Buku tidak ditemukan. Coba gunakan kata kunci lain.");
                    }
                } catch (err) {
                    console.error(err);
                    setError("Terjadi kesalahan saat mencari buku. " + err.message);
                } finally {
                    setIsLoadingSearch(false);
                }
            };

            const generateBookContent = async (bookInfo) => {
                setSelectedBook(bookInfo);
                setStep('content');
                setIsLoadingContent(true);
                setError("");
                setData(null);
                setCopiedId(null);
                setSelectedReviewIndices([0]); // Set default pilih review pertama (jika ada)

                // Ekstrak info buku dari Google Books
                const title = bookInfo.volumeInfo.title || "Judul Tidak Diketahui";
                const authors = bookInfo.volumeInfo.authors ? bookInfo.volumeInfo.authors.join(", ") : "Penulis Tidak Diketahui";

                if (provider === 'gemini' && (!apiKey || apiKey.trim() === '')) {
                    setError("API Key Gemini belum diisi. Silakan masukkan API Key Anda melalui tombol pengaturan.");
                    setIsLoadingContent(false);
                    setStep('results');
                    return;
                }
                
                if (provider === 'openai' && (!openaiEndpoint || !openaiApiKey || !openaiModel)) {
                    setError("Konfigurasi OpenAI belum lengkap (Endpoint, API Key, atau Model kosong). Silakan periksa pengaturan.");
                    setIsLoadingContent(false);
                    setStep('results');
                    return;
                }

                try {
                    const promptText = `Buku: "${title}" karya ${authors}. 
LANGKAH WAJIB PERTAMA: Ingat atau cari tahu SINOPSIS ASLI DAN PLOT buku ini. JANGAN MENGARANG (HALUSINASI) PLOT! Cerita teaser yang kamu buat HARUS akurat dengan jalan cerita dan konflik asli di dalam buku tersebut.
LANGKAH KEDUA: Carikan URL gambar cover asli buku ini yang valid (format .jpg, .webp, atau .png) dari situs seperti Goodreads atau internet, lalu masukkan ke field 'coverImageUrl'.
LANGKAH KETIGA: Lengkapi data metadata buku ini (Judul resmi, Penulis, Tahun Terbit, Jumlah Halaman). Perbaiki jika input awal salah ketik atau kurang lengkap.
PERHATIAN UNTUK PROMPT GAMBAR: Jangan masukkan teks review di dalam output 'imagePrompt', karena teks review akan ditambahkan secara dinamis oleh sistem.`;

                    const systemText = `Kamu adalah seorang asisten literasi, kritikus buku, dan copywriter marketing yang ahli.
Tugasmu:
1. Cari dan berikan MAKSIMAL 5 review ASLI tentang buku ini. WAJIB PRIORITASKAN MENCARI REVIEW DALAM BAHASA INDONESIA. Tuliskan kutipan review persis dalam BAHASA ASLINYA (tidak diterjemahkan). JANGAN HALUSINASI. Pastikan URL sumber (sourceUrl) valid.
2. Buatkan sebuah CERITA PENDEK naratif yang sangat RELATABLE dengan konflik/misteri di buku ini. SYARAT MUTLAK: Panjang cerita HARUS berada di rentang 300 hingga 500 karakter (termasuk huruf dan spasi). Akhiri dengan Call-To-Action (CTA) untuk membaca bukunya.
3. Buat sebuah PROMPT GENERASI GAMBAR (dalam bahasa Inggris, sangat detail, cinematic) untuk Midjourney/DALL-E 3 dengan tujuan membuat Background Poster.
ATURAN MUTLAK PROMPT GAMBAR: Visual HANYA BOLEH berisi Environment. DILARANG KERAS memasukkan makhluk hidup. Jelaskan eksplisit bahwa gambar cover akan divisualisasikan menjadi BUKU FISIK ASLI (physical book) yang menyatu di environment tersebut. Jangan masukkan parameter rasio atau teks di prompt.
4. Berikan KOMENTAR AI (analisis singkat bahasa Indonesia) tentang visual environment.

WAJIB MENGEMBALIKAN HANYA FORMAT JSON VALID DENGAN STRUKTUR INI, TANPA MARKDOWN BACKTICKS (Hanya JSON murni):
{
  "reviews": [
    {"reviewer": "Nama", "role": "Profesi/Jabatan", "review": "Isi review", "sourceUrl": "https://..."}
  ],
  "coverImageUrl": "https://...",
  "exactTitle": "Judul Akurat",
  "exactAuthors": "Penulis",
  "publishedYear": "2020",
  "pageCount": "300",
  "teaserStory": "Isi cerita 300-500 karakter...",
  "imagePrompt": "English prompt...",
  "aiCommentary": "Komentar..."
}`;

                    let parsedData = null;

                    if (provider === 'gemini') {
                        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${geminiModel}:generateContent?key=${apiKey}`;
                        const payload = {
                            contents: [{ parts: [{ text: promptText }] }],
                            tools: [{ "google_search": {} }], // Grounding aktif untuk Gemini
                            systemInstruction: { parts: [{ text: systemText }] },
                            generationConfig: { responseMimeType: "application/json" }
                        };

                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if (!response.ok) {
                            const errData = await response.json().catch(() => ({}));
                            throw new Error(`HTTP error Gemini! status: ${response.status}. ${errData.error?.message || 'Terjadi kesalahan pada endpoint Gemini.'}`);
                        }
                        const result = await response.json();
                        const jsonString = result.candidates[0].content.parts[0].text;
                        parsedData = JSON.parse(jsonString);

                    } else if (provider === 'openai') {
                        let baseUrl = openaiEndpoint.replace(/\/$/, '');
                        if (baseUrl.endsWith('/chat/completions')) {
                            baseUrl = baseUrl.replace('/chat/completions', '');
                        }
                        const apiUrl = `${baseUrl}/chat/completions`;
                        const payload = {
                            model: openaiModel,
                            messages: [
                                { role: "system", content: systemText },
                                { role: "user", content: promptText }
                            ],
                            temperature: 0.7
                        };

                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${openaiApiKey}`
                            },
                            body: JSON.stringify(payload)
                        });

                        if (!response.ok) {
                            const errData = await response.json().catch(() => ({}));
                            throw new Error(`HTTP error OpenAI API! status: ${response.status}. ${response.status === 404 ? 'Endpoint URL tidak ditemukan (404). Pastikan Base URL hanya sampai versi API (misal: https://api.openai.com/v1).' : (errData.error?.message || 'Cek kembali URL Endpoint atau nama Model Anda.')}`);
                        }
                        
                        const result = await response.json();
                        
                        let jsonString = result.choices[0].message.content;
                        // Bersihkan dari sisa markdown jika model membandel
                        jsonString = jsonString.replace(/```json/gi, '').replace(/```/gi, '').trim();
                        
                        try {
                            parsedData = JSON.parse(jsonString);
                        } catch (parseError) {
                            console.error("Raw response:", result.choices[0].message.content);
                            throw new Error("Model ini gagal mengembalikan format JSON yang valid (AI malah menjawab dengan teks biasa). Silakan gunakan model yang lebih pintar atau gunakan Gemini.");
                        }
                    }

                    if (parsedData) {
                        setData(parsedData);
                    } else {
                        throw new Error("Gagal mem-parsing data.");
                    }

                } catch (err) {
                    console.error(err);
                    setError("Terjadi kesalahan saat memproses permintaan AI. " + err.message);
                    setStep('results'); 
                } finally {
                    setIsLoadingContent(false);
                }
            };

            const handleCopyText = (text, id) => {
                if (!text) return;
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    setCopiedId(id);
                    setTimeout(() => setCopiedId(null), 2500);
                } catch (err) {
                    console.error('Gagal menyalin text', err);
                    alert("Gagal menyalin ke clipboard.");
                }
                document.body.removeChild(textArea);
            };

            const copyAllReviews = () => {
                if (!data || !data.reviews) return;
                const allReviewsText = data.reviews.map(r => {
                    let text = `"${r.review}"\n— ${r.reviewer}, ${r.role}`;
                    if (includeLinks && r.sourceUrl) {
                        text += `\nSumber: ${r.sourceUrl}`;
                    }
                    return text;
                }).join('\n\n');
                handleCopyText(allReviewsText, 'all-reviews');
            };

            const handleDownloadCover = async (url, title) => {
                if (!url || url.includes('No+Cover')) {
                    alert("Tidak ada gambar cover yang valid untuk diunduh.");
                    return;
                }
                try {
                    // Coba fetch untuk mendapatkan blob (mungkin diblokir karena kebijakan CORS API eksternal)
                    const response = await fetch(url);
                    const blob = await response.blob();
                    const blobUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = blobUrl;
                    a.download = `Cover - ${title}.jpg`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(blobUrl);
                    document.body.removeChild(a);
                } catch (error) {
                    console.warn("Fetch diblokir oleh CORS, membuka di tab baru sebagai fallback.", error);
                    // Fallback: Buka di tab baru (user bisa save as secara manual)
                    window.open(url, '_blank');
                }
            };

            const resetSearch = () => {
                setStep('search');
                setSearchQuery("");
                setSearchResults([]);
                setSelectedBook(null);
                setData(null);
                setShowManualForm(false);
            };

            const handleManualSubmit = (e) => {
                e.preventDefault();
                if (!manualTitle.trim()) {
                    setError("Judul buku tidak boleh kosong.");
                    return;
                }
                const mockBook = {
                    id: 'manual-' + Date.now(),
                    volumeInfo: {
                        title: manualTitle,
                        authors: manualAuthor ? [manualAuthor] : ["Penulis Tidak Diketahui"],
                        imageLinks: null,
                        publishedDate: "",
                        pageCount: null
                    }
                };
                generateBookContent(mockBook);
            };

            return (
                <div className="max-w-6xl mx-auto px-4 py-12 md:py-16">
                    {/* Header */}
                    <header className="text-center mb-10">
                        <h1 onClick={resetSearch} className="text-4xl md:text-5xl font-extrabold text-amber-900 mb-4 tracking-tight cursor-pointer hover:text-amber-700 transition-colors inline-block">
                            Book <span className="text-amber-600">Hook</span>
                        </h1>
                        <p className="text-lg text-slate-600 max-w-2xl mx-auto">
                            Cari buku, dapatkan cerita naratif <i>clickbait</i>, dan temukan review asli dari tokoh publik untuk memikat orang membaca!
                        </p>
                    </header>

                    {/* API Key Settings */}
                    <div className="max-w-2xl mx-auto mb-6">
                        {showApiSettings ? (
                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-xl shadow-amber-900/5 animate-fade-in text-left">
                                <h3 className="font-bold text-lg text-slate-800 mb-4 border-b border-slate-100 pb-2">Pengaturan Model AI</h3>
                                
                                {/* Provider Tabs */}
                                <div className="flex gap-2 mb-5 bg-slate-50 p-1 rounded-xl w-fit border border-slate-200">
                                    <button 
                                        onClick={() => setProvider('gemini')}
                                        className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all ${provider === 'gemini' ? 'bg-white text-blue-600 shadow-sm border border-slate-200' : 'text-slate-500 hover:text-slate-700'}`}
                                    >
                                        Google Gemini
                                    </button>
                                    <button 
                                        onClick={() => setProvider('openai')}
                                        className={`px-4 py-2 rounded-lg text-sm font-semibold transition-all ${provider === 'openai' ? 'bg-white text-emerald-600 shadow-sm border border-slate-200' : 'text-slate-500 hover:text-slate-700'}`}
                                    >
                                        OpenAI Compatible
                                    </button>
                                </div>

                                {provider === 'gemini' && (
                                    <div className="space-y-4 animate-fade-in">
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-1">Gemini API Key</label>
                                            <input 
                                                type="password" 
                                                value={apiKey}
                                                onChange={(e) => setApiKey(e.target.value)}
                                                placeholder="Masukkan kunci AIzaSy..." 
                                                className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50"
                                            />
                                            <p className="text-xs text-slate-500 mt-2">Dapatkan API Key gratis di <a href="https://aistudio.google.com" target="_blank" className="text-blue-500 hover:underline">Google AI Studio</a>. (Mendukung Web Grounding).</p>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-1">Model Gemini</label>
                                            <input 
                                                type="text" 
                                                value={geminiModel}
                                                onChange={(e) => setGeminiModel(e.target.value)}
                                                placeholder="Contoh: gemini-1.5-flash-latest" 
                                                className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 bg-slate-50 font-mono text-sm"
                                            />
                                            <p className="text-xs text-slate-500 mt-2">Bawaan: <b>gemini-1.5-flash-latest</b>. Jika masih error 404, coba ganti ke <b>gemini-pro</b> atau <b>gemini-1.5-pro-latest</b>.</p>
                                        </div>
                                    </div>
                                )}

                                {provider === 'openai' && (
                                    <div className="space-y-4 animate-fade-in">
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-1">Endpoint URL (Base URL)</label>
                                            <input 
                                                type="text" 
                                                value={openaiEndpoint}
                                                onChange={(e) => setOpenaiEndpoint(e.target.value)}
                                                placeholder="https://api.openai.com/v1" 
                                                className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50 font-mono text-sm"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-bold text-slate-700 mb-1">API Key</label>
                                            <input 
                                                type="password" 
                                                value={openaiApiKey}
                                                onChange={(e) => setOpenaiApiKey(e.target.value)}
                                                placeholder="sk-..." 
                                                className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50 font-mono text-sm"
                                            />
                                        </div>
                                        <div>
                                            <div className="flex justify-between items-end mb-1">
                                                <label className="block text-sm font-bold text-slate-700">Pilih Model</label>
                                                <button 
                                                    onClick={fetchOpenAIModels}
                                                    disabled={isFetchingModels || !openaiEndpoint || !openaiApiKey}
                                                    className="text-xs bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-1 px-3 rounded-lg transition-colors disabled:opacity-50"
                                                >
                                                    {isFetchingModels ? "Menarik..." : "Tarik Model dari API"}
                                                </button>
                                            </div>
                                            
                                            {/* Kombinasi Select atau Input Manual */}
                                            {openaiModelsList.length > 0 ? (
                                                <div className="flex gap-2">
                                                    <select 
                                                        value={openaiModel}
                                                        onChange={(e) => setOpenaiModel(e.target.value)}
                                                        className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50"
                                                    >
                                                        {openaiModelsList.map(m => (
                                                            <option key={m.id} value={m.id}>{m.id}</option>
                                                        ))}
                                                    </select>
                                                    <button onClick={() => setOpenaiModelsList([])} className="px-3 bg-red-100 text-red-600 rounded-xl hover:bg-red-200 text-xs font-bold whitespace-nowrap" title="Batal Pilih, Ketik Manual">Reset</button>
                                                </div>
                                            ) : (
                                                <input 
                                                    type="text" 
                                                    value={openaiModel}
                                                    onChange={(e) => setOpenaiModel(e.target.value)}
                                                    placeholder="Contoh: gpt-3.5-turbo atau nama model lokal" 
                                                    className="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-slate-50 font-mono text-sm"
                                                />
                                            )}
                                        </div>
                                        <p className="text-xs text-slate-500 mt-2">Catatan: Model OpenAI-compatible mungkin tidak memiliki fitur <i>Web Grounding</i> (pencarian langsung ke internet) sekuat Gemini.</p>
                                    </div>
                                )}

                                <div className="mt-6 flex justify-end gap-3">
                                    <button 
                                        onClick={() => setShowApiSettings(false)}
                                        className="px-5 py-2.5 rounded-xl font-bold text-slate-600 hover:bg-slate-100 transition-colors"
                                    >
                                        Tutup
                                    </button>
                                    <button 
                                        onClick={saveSettings}

                                                </div>
                                                <p className="text-xs text-indigo-300/70">
                                                    *Anda dapat mencentang review di atas untuk menambahkannya ke dalam teks overlay poster. Prompt ini sudah memerintahkan AI gambar untuk memvisualisasikan cover sebagai buku fisik sungguhan.
                                                </p>
                                            </div>

                                            {/* AI Commentary */}
                                            <div className="space-y-3">
                                                <h4 className="text-lg font-semibold text-indigo-200 flex items-center gap-2">
                                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                                                    </svg>
                                                    Komentar AI & Keselarasan Tema
                                                </h4>
                                                <div className="bg-slate-800/50 p-5 rounded-xl border border-slate-700/50 h-auto sm:h-[calc(100%-2.5rem)]">
                                                    <p className="text-sm text-slate-300 leading-relaxed font-serif-custom">
                                                        {data.aiCommentary || "Komentar tidak tersedia."}
                                                    </p>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Bottom Section: Sources / Proof Links */}
                                    <div className="bg-slate-900 rounded-3xl p-8 shadow-lg mt-8 text-slate-300">
                                        <h3 className="text-xl font-bold text-white flex items-center gap-2 mb-6">
                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                                            </svg>
                                            Sumber Referensi Review
                                        </h3>
                                        <p className="text-sm mb-4 text-slate-400">Untuk memastikan validitas, berikut adalah link dari mana review-review di atas diperoleh:</p>
                                        <ul className="space-y-3">
                                            {data.reviews && data.reviews.map((rev, idx) => (
                                                <li key={idx} className="flex flex-col sm:flex-row sm:items-center gap-2 bg-slate-800/50 p-3 rounded-xl">
                                                    <span className="font-semibold text-amber-400 min-w-[120px]">{rev.reviewer}</span>
                                                    <a href={rev.sourceUrl} target="_blank" rel="noopener noreferrer" className="text-blue-400 hover:text-blue-300 text-sm truncate hover:underline flex-1 break-all">
                                                        {rev.sourceUrl || 'Link tidak tersedia'}
                                                    </a>
                                                </li>
                                            ))}
                                            {(!data.reviews || data.reviews.length === 0) && (
                                                <li className="text-sm italic text-slate-500">Tidak ada sumber yang tersedia.</li>
                                            )}
                                        </ul>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                    
                    <style>
                        {`
                        @keyframes fadeIn {
                            from { opacity: 0; transform: translateY(10px); }
                            to { opacity: 1; transform: translateY(0); }
                        }
                        .animate-fade-in {
                            animation: fadeIn 0.6s ease-out forwards;
                        }
                        .custom-scrollbar::-webkit-scrollbar {
                            width: 6px;
                        }
                        .custom-scrollbar::-webkit-scrollbar-track {
                            background: transparent;
                        }
                        .custom-scrollbar::-webkit-scrollbar-thumb {
                            background-color: #cbd5e1;
                            border-radius: 20px;
                        }
                        `}
                    </style>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
