<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Hook - Review & Teaser Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fcf9f2; /* Warna kertas hangat */
            color: #334155;
        }
        .font-serif-custom {
            font-family: 'Merriweather', serif;
        }
        /* Loader animation */
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #d97706; /* amber-600 */
            border-radius: 50%;
            width: 42px;
            height: 42px;
            animation: spin 1s linear infinite;
        }
        .loader-sm {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            // State navigasi multi-step: 'search' | 'results' | 'content'
            const [step, setStep] = useState('search');
            const [searchQuery, setSearchQuery] = useState("");
            const [searchResults, setSearchResults] = useState([]);
            const [selectedBook, setSelectedBook] = useState(null);
            
            const [isLoadingSearch, setIsLoadingSearch] = useState(false);
            const [isLoadingContent, setIsLoadingContent] = useState(false);
            const [data, setData] = useState(null);
            const [error, setError] = useState("");
            const [copiedId, setCopiedId] = useState(null);
            const [includeLinks, setIncludeLinks] = useState(false);
            const [selectedReviewIndices, setSelectedReviewIndices] = useState([0]);

            // Provider & API Settings
            const [provider, setProvider] = useState(() => localStorage.getItem('llm_provider') || 'gemini');
            const [apiKey, setApiKey] = useState(() => localStorage.getItem('gemini_api_key') || '');
            const [geminiModel, setGeminiModel] = useState(() => {
                const saved = localStorage.getItem('gemini_model');
                if (saved && saved !== 'gemini-1.5-flash-latest' && saved !== 'gemini-pro') {
                    return saved;
                }
                return 'gemini-2.0-flash';
            });
            
            // OpenAI Compatible States
            const [openaiEndpoint, setOpenaiEndpoint] = useState(() => localStorage.getItem('openai_endpoint') || 'https://api.openai.com/v1');
            const [openaiApiKey, setOpenaiApiKey] = useState(() => localStorage.getItem('openai_api_key') || '');
            const [openaiModel, setOpenaiModel] = useState(() => localStorage.getItem('openai_model') || 'gpt-4o-mini');
            const [openaiModelsList, setOpenaiModelsList] = useState([]);
            const [isFetchingModels, setIsFetchingModels] = useState(false);

            const [showApiSettings, setShowApiSettings] = useState(() => {
                return !localStorage.getItem('gemini_api_key') && !localStorage.getItem('openai_api_key');
            });

            // State Tes Koneksi API
            const [testStatus, setTestStatus] = useState({ loading: false, message: "", success: null });

            // State Input Manual
            const [showManualForm, setShowManualForm] = useState(false);
            const [manualTitle, setManualTitle] = useState("");
            const [manualAuthor, setManualAuthor] = useState("");
            const [manualYear, setManualYear] = useState("");

            const saveSettings = () => {
                localStorage.setItem('llm_provider', provider);
                if (provider === 'gemini') {
                    localStorage.setItem('gemini_api_key', apiKey);
                    localStorage.setItem('gemini_model', geminiModel);
                } else {
                    localStorage.setItem('openai_endpoint', openaiEndpoint);
                    localStorage.setItem('openai_api_key', openaiApiKey);
                    localStorage.setItem('openai_model', openaiModel);
                }
                setShowApiSettings(false);
            };

            const testApiConnection = async () => {
                setTestStatus({ loading: true, message: "Menguji koneksi ke server AI...", success: null });
                try {
                    if (provider === 'gemini') {
                        if (!apiKey || !apiKey.trim()) {
                            throw new Error("API Key Gemini belum diisi.");
                        }
                        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${geminiModel}:generateContent?key=${apiKey.trim()}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: "Jawab satu kata saja: SIAP" }] }]
                            })
                        });
                        if (!res.ok) {
                            const errData = await res.json().catch(() => ({}));
                            throw new Error(errData.error?.message || `HTTP ${res.status}`);
                        }
                        const resJson = await res.json();
                        const reply = resJson.candidates?.[0]?.content?.parts?.[0]?.text || "OK";
                        setTestStatus({
                            loading: false,
                            message: `Koneksi Gemini Berhasil! Model "${geminiModel}" merespon: "${reply.trim()}"`,
                            success: true
                        });
                    } else {
                        if (!openaiEndpoint || !openaiEndpoint.trim()) {
                            throw new Error("Endpoint URL belum diisi.");
                        }
                        let baseUrl = openaiEndpoint.trim().replace(/\/$/, '');
                        if (baseUrl.endsWith('/chat/completions')) {
                            baseUrl = baseUrl.replace('/chat/completions', '');
                        }
                        const headers = { 'Content-Type': 'application/json' };
                        if (openaiApiKey && openaiApiKey.trim()) {
                            headers['Authorization'] = `Bearer ${openaiApiKey.trim()}`;
                        }
                        const res = await fetch(`${baseUrl}/chat/completions`, {
                            method: 'POST',
                            headers: headers,
                            body: JSON.stringify({
                                model: openaiModel || 'gpt-4o-mini',
                                messages: [{ role: 'user', content: "Jawab satu kata: SIAP" }],
                                max_tokens: 10
                            })
                        });
                        if (!res.ok) {
                            const errData = await res.json().catch(() => ({}));
                            throw new Error(errData.error?.message || (res.status === 404 ? 'Endpoint 404 (URL salah)' : `HTTP ${res.status}`));
                        }
                        setTestStatus({
                            loading: false,
                            message: `Koneksi OpenAI Berhasil! Endpoint merespon dengan baik.`,
                            success: true
                        });
                    }
                } catch (err) {
                    setTestStatus({
                        loading: false,
                        message: `Gagal: ${err.message}`,
                        success: false
                    });
                }
            };

            const fetchOpenAIModels = async () => {
                if (!openaiEndpoint) return;
                setIsFetchingModels(true);
                try {
                    let baseUrl = openaiEndpoint.trim().replace(/\/$/, '');
                    if (baseUrl.endsWith('/chat/completions')) {
                        baseUrl = baseUrl.replace('/chat/completions', '');
                        setOpenaiEndpoint(baseUrl);
                    }
                    const headers = { 'Content-Type': 'application/json' };
                    if (openaiApiKey && openaiApiKey.trim()) {
                        headers['Authorization'] = `Bearer ${openaiApiKey.trim()}`;
                    }
                    const res = await fetch(`${baseUrl}/models`, {
                        method: 'GET',
                        headers: headers
                    });
                    if (!res.ok) throw new Error("Gagal menarik data model (HTTP " + res.status + "). Cek API Key atau CORS.");
                    const data = await res.json();
                    if (data && data.data && Array.isArray(data.data)) {
                        setOpenaiModelsList(data.data);
                        if (data.data.length > 0 && !openaiModel) {
                            setOpenaiModel(data.data[0].id);
                        }
                    } else {
                        alert("Format respon endpoint tidak sesuai standar OpenAI.");
                    }
                } catch (err) {
                    console.error(err);
                    alert("Gagal memuat model dari API: " + err.message + "\n\nCatatan: Anda tetap bisa mengetikkan nama model secara manual.");
                } finally {
                    setIsFetchingModels(false);
                }
            };

            const searchGoogleBooks = async (e) => {
                if (e) e.preventDefault();
                if (!searchQuery.trim()) {
                    setError("Silakan masukkan judul buku terlebih dahulu.");
                    return;
                }

                setIsLoadingSearch(true);
                setError("");
                setSearchResults([]);
                setStep('search');

                try {
                    let items = [];
                    
                    // Upaya 1: Google Books API
                    try {
                        const response = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(searchQuery)}&maxResults=6`);
                        if (response.ok) {
                            const result = await response.json();
                            if (result.items && Array.isArray(result.items) && result.items.length > 0) {
                                items = result.items;
                            }
                        }
                    } catch (gbErr) {
                        console.warn("Google Books API network error:", gbErr);
                    }

                    // Upaya 2: Fallback ke OpenLibrary API jika Google Books kosong atau gagal
                    if (items.length === 0) {
                        console.log("Mencari di OpenLibrary API sebagai fallback...");
                        try {
                            const fallbackResponse = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(searchQuery)}&limit=6`);
                            if (fallbackResponse.ok) {
                                const fallbackResult = await fallbackResponse.json();
                                if (fallbackResult.docs && fallbackResult.docs.length > 0) {
                                    items = fallbackResult.docs.map(doc => ({
                                        id: doc.key || ('ol-' + Math.random().toString(36).substring(2, 9)),
                                        volumeInfo: {
                                            title: doc.title || "Judul Tidak Diketahui",
                                            authors: Array.isArray(doc.author_name) 
                                                ? doc.author_name 
                                                : (doc.author_name ? [doc.author_name] : ["Penulis Tidak Diketahui"]),
                                            publishedDate: doc.first_publish_year ? String(doc.first_publish_year) : '',
                                            imageLinks: doc.cover_i ? { thumbnail: `https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg` } : null,
                                            pageCount: doc.number_of_pages_median || null
                                        }
                                    }));
                                }
                            }
                        } catch (olErr) {
                            console.warn("OpenLibrary API error:", olErr);
                        }
                    }

                    if (items.length > 0) {
                        setSearchResults(items);
                        setStep('results');
                    } else {
                        setError("Buku tidak ditemukan di Google Books maupun Open Library. Coba kata kunci lain atau gunakan fitur input manual.");
                    }
                } catch (err) {
                    console.error(err);
                    setError("Terjadi kesalahan saat mencari buku: " + err.message);
                } finally {
                    setIsLoadingSearch(false);
                }
            };

            const parseAIText = (rawText) => {
                if (!rawText) throw new Error("Respon dari AI kosong.");
                let text = rawText.trim();
                
                // Cek blok kode markdown ```json ... ```
                const jsonBlockMatch = text.match(/```(?:json)?\s*([\s\S]*?)\s*```/i);
                let clean = jsonBlockMatch ? jsonBlockMatch[1].trim() : text;
                
                let start = clean.indexOf('{');
                if (start === -1) {
                    clean = text;
                    start = clean.indexOf('{');
                }
                if (start === -1) throw new Error("Format AI tidak mengandung awalan JSON '{'.");
                
                let depth = 0, inString = false, escapeNext = false, end = -1;
                
                for (let i = start; i < clean.length; i++) {
                    const char = clean[i];
                    if (escapeNext) { escapeNext = false; continue; }
                    if (char === '\\') { escapeNext = true; continue; }
                    if (char === '"') { inString = !inString; continue; }
                    if (!inString) {
                        if (char === '{') depth++;
                        if (char === '}') depth--;
                        if (depth === 0) { end = i; break; }
                    }
                }
                
                const finalJsonStr = clean.substring(start, (end !== -1 ? end : clean.lastIndexOf('}')) + 1);
                try {
                    return JSON.parse(finalJsonStr);
                } catch (e) {
                    try {
                        return JSON.parse(finalJsonStr.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, ""));
                    } catch (e2) {
                        return JSON.parse(finalJsonStr.replace(/(?:\r\n|\r|\n)/g, " "));
                    }
                }
            };

            const generateBookContent = async (bookInfo) => {
                setSelectedBook(bookInfo);
                setStep('content');
                setIsLoadingContent(true);
                setError("");
                setData(null);
                setCopiedId(null);
                setSelectedReviewIndices([]);

                const title = bookInfo.volumeInfo?.title || "Judul Tidak Diketahui";
                const authors = bookInfo.volumeInfo?.authors ? bookInfo.volumeInfo.authors.join(", ") : "Penulis Tidak Diketahui";

                if (provider === 'gemini' && (!apiKey || apiKey.trim() === '')) {
                    setError("API Key Gemini belum diisi. Silakan masukkan API Key Anda di menu pengaturan ⚙️.");
                    setIsLoadingContent(false);
                    setShowApiSettings(true);
                    return;
                }
                
                if (provider === 'openai' && (!openaiEndpoint || !openaiModel)) {
                    setError("Konfigurasi OpenAI belum lengkap (Endpoint atau Model kosong). Silakan periksa menu pengaturan.");
                    setIsLoadingContent(false);
                    setShowApiSettings(true);
                    return;
                }

                try {
                    const promptText = `Buku: "${title}" karya ${authors}. 
LANGKAH 1 (PLOT & AKURASI): Cari tahu SINOPSIS ASLI DAN PLOT buku ini. DILARANG MENGARANG (HALUSINASI) PLOT! Cerita teaser yang kamu buat HARUS akurat dengan cerita, tokoh, dan konflik asli buku tersebut.
LANGKAH 2 (COVER ASLI): Carikan URL gambar cover asli buku ini yang valid (format .jpg, .webp, atau .png) dari Goodreads, Amazon, atau web, lalu masukkan ke field 'coverImageUrl'.
LANGKAH 3 (METADATA): Lengkapi data metadata buku ini (Judul resmi, Penulis, Tahun Terbit, Jumlah Halaman).
PERHATIAN UNTUK PROMPT GAMBAR: Jangan masukkan teks review di dalam output 'imagePrompt'. Cukup visualisasikan environment yang cinematic dan cocok dengan tema buku.`;

                    const systemText = `Kamu adalah seorang asisten literasi, kritikus buku, dan copywriter marketing yang ahli.
Tugasmu:
1. Cari dan berikan MAKSIMAL 5 review ASLI tentang buku ini. WAJIB PRIORITASKAN MENCARI REVIEW DALAM BAHASA INDONESIA. Tuliskan kutipan review persis dalam BAHASA ASLINYA. Pastikan URL sumber (sourceUrl) valid.
2. Buatkan sebuah CERITA PENDEK naratif yang sangat RELATABLE dan memancing rasa penasaran pembaca (hook). SYARAT MUTLAK: Panjang cerita HARUS berada di rentang 300 hingga 500 karakter (termasuk spasi). Akhiri dengan Call-To-Action (CTA) untuk membaca bukunya.
3. Buat sebuah PROMPT GENERASI GAMBAR (dalam bahasa Inggris, sangat detail, cinematic) untuk Midjourney/DALL-E 3 dengan tujuan membuat Background Poster. Visual HANYA BOLEH berisi Environment/suasana tanpa orang, dan jelaskan eksplisit bahwa gambar cover akan divisualisasikan menjadi physical book yang menyatu di environment tersebut.
4. Berikan KOMENTAR AI (analisis singkat bahasa Indonesia) tentang visual environment dan korelasi tematiknya dengan buku.

WAJIB MENGEMBALIKAN HANYA FORMAT JSON VALID DENGAN STRUKTUR INI (Tanpa teks pembuka atau penutup):
{
  "reviews": [
    {"reviewer": "Nama", "role": "Profesi/Jabatan", "review": "Isi review", "sourceUrl": "https://..."}
  ],
  "coverImageUrl": "https://...",
  "exactTitle": "Judul Akurat",
  "exactAuthors": "Penulis",
  "publishedYear": "2020",
  "pageCount": "300",
  "teaserStory": "Isi cerita 300-500 karakter...",
  "imagePrompt": "English prompt...",
  "aiCommentary": "Komentar..."
}`;

                    let parsedData = null;

                    if (provider === 'gemini') {
                        const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${geminiModel}:generateContent?key=${apiKey.trim()}`;
                        
                        // Fungsi request Gemini dengan proteksi konflik tools vs responseMimeType
                        const sendGeminiRequest = async (useGoogleSearch) => {
                            const payload = {
                                contents: [{ parts: [{ text: promptText }] }],
                                systemInstruction: { parts: [{ text: systemText }] },
                                generationConfig: {
                                    temperature: 0.7
                                }
                            };
                            if (useGoogleSearch) {
                                payload.tools = [{ "google_search": {} }];
                            } else {
                                payload.generationConfig.responseMimeType = "application/json";
                            }

                            return await fetch(apiUrl, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });
                        };

                        // Coba pertama kali dengan Google Search grounding (tanpa responseMimeType agar tidak konflik)
                        let response = await sendGeminiRequest(true);

                        // Jika gagal karena tool tidak didukung atau 400, auto-fallback tanpa tools
                        if (!response.ok) {
                            console.warn(`Gemini dengan Google Search grounding gagal (status ${response.status}), mencoba tanpa tools...`);
                            response = await sendGeminiRequest(false);
                        }

                        if (!response.ok) {
                            const errData = await response.json().catch(() => ({}));
                            throw new Error(`HTTP ${response.status} Gemini: ${errData.error?.message || 'Gagal memproses permintaan.'}`);
                        }

                        const result = await response.json();
                        const candidate = result.candidates?.[0];
                        if (!candidate || !candidate.content) {
                            if (candidate?.finishReason) {
                                throw new Error(`AI tidak menghasilkan konten (Alasan: ${candidate.finishReason}).`);
                            }
                            throw new Error("Respon Gemini kosong.");
                        }

                        const parts = candidate.content.parts || [];
                        // Filter konten teks aktual (abaikan parts thinking jika ada)
                        const contentParts = parts.filter(p => p.text && !p.thought);
                        const jsonString = (contentParts.length > 0 ? contentParts : parts)
                            .map(p => p.text || '')
                            .join('');

                        if (!jsonString.trim()) {
                            throw new Error("Tidak ada teks dalam respon Gemini.");
                        }

                        parsedData = parseAIText(jsonString);

                    } else if (provider === 'openai') {
                        let baseUrl = openaiEndpoint.trim().replace(/\/$/, '');
                        if (baseUrl.endsWith('/chat/completions')) {
                            baseUrl = baseUrl.replace('/chat/completions', '');
                        }
                        const apiUrl = `${baseUrl}/chat/completions`;
                        const payload = {
                            model: openaiModel || 'gpt-4o-mini',
                            messages: [
                                { role: "system", content: systemText },
                                { role: "user", content: promptText }
                            ],
                            temperature: 0.7
                        };

                        const headers = { 'Content-Type': 'application/json' };
                        if (openaiApiKey && openaiApiKey.trim()) {
                            headers['Authorization'] = `Bearer ${openaiApiKey.trim()}`;
                        }

                        const response = await fetch(apiUrl, {
                            method: 'POST',
                            headers: headers,
                            body: JSON.stringify(payload)
                        });

                        if (!response.ok) {
                            const errData = await response.json().catch(() => ({}));
                            throw new Error(`HTTP ${response.status} OpenAI API: ${errData.error?.message || 'Gagal memproses ke endpoint.'}`);
                        }
                        
                        const result = await response.json();
                        const choice = result.choices?.[0];
                        if (!choice) throw new Error("Format respon OpenAI tidak memiliki data choices.");
                        
                        let jsonString = choice.message?.content || choice.message?.reasoning_content || "";
                        // Bersihkan tag <think> jika memakai model penalaran (DeepSeek-R1 dsb)
                        if (jsonString.includes("</think>")) {
                            jsonString = jsonString.split("</think>").pop();
                        }
                        
                        parsedData = parseAIText(jsonString);
                    }

                    if (!parsedData || typeof parsedData !== 'object') {
                        throw new Error("Gagal menguraikan respon AI menjadi objek data.");
                    }

                    // Sanitasi data agar bebas dari null/undefined yang dapat menyebabkan crash pada React
                    const cleanData = {
                        exactTitle: parsedData.exactTitle || bookInfo.volumeInfo?.title || "Judul Tidak Diketahui",
                        exactAuthors: parsedData.exactAuthors || (bookInfo.volumeInfo?.authors?.join(", ")) || "Penulis Tidak Diketahui",
                        publishedYear: parsedData.publishedYear || bookInfo.volumeInfo?.publishedDate?.substring(0, 4) || "-",
                        pageCount: parsedData.pageCount || bookInfo.volumeInfo?.pageCount || null,
                        coverImageUrl: (typeof parsedData.coverImageUrl === 'string' && parsedData.coverImageUrl.startsWith('http')) 
                            ? parsedData.coverImageUrl 
                            : "",
                        teaserStory: typeof parsedData.teaserStory === 'string' 
                            ? parsedData.teaserStory 
                            : (parsedData.teaserStory ? String(parsedData.teaserStory) : "Cerita naratif belum tersedia."),
                        reviews: Array.isArray(parsedData.reviews) 
                            ? parsedData.reviews.filter(r => r && (r.review || r.reviewer)) 
                            : [],
                        imagePrompt: typeof parsedData.imagePrompt === 'string' 
                            ? parsedData.imagePrompt 
                            : "Cinematic atmospheric background depicting the themes of the book, physical book integrated, dramatic lighting",
                        aiCommentary: typeof parsedData.aiCommentary === 'string' 
                            ? parsedData.aiCommentary 
                            : ""
                    };

                    setData(cleanData);
                    if (cleanData.reviews.length > 0) {
                        setSelectedReviewIndices([0]);
                    } else {
                        setSelectedReviewIndices([]);
                    }

                } catch (err) {
                    console.error("Error generateBookContent:", err);
                    setError("Terjadi kesalahan saat memproses permintaan AI: " + err.message);
                } finally {
                    setIsLoadingContent(false);
                }
            };

            // Clipboard copy dengan dukungan fallback untuk mobile dan insecure context
            const handleCopyText = async (text, id) => {
                if (!text) return;
                let success = false;
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(text);
                        success = true;
                    }
                } catch (err) {
                    console.warn("navigator.clipboard gagal, mencoba textarea fallback", err);
                }

                if (!success) {
                    try {
                        const textArea = document.createElement("textarea");
                        textArea.value = text;
                        textArea.style.position = "fixed";
                        textArea.style.left = "-999999px";
                        textArea.style.top = "-999999px";
                        document.body.appendChild(textArea);
                        textArea.focus();
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                        success = true;
                    } catch (err) {
                        console.error('Gagal menyalin text', err);
                        alert("Gagal menyalin ke clipboard. Silakan salin secara manual.");
                        return;
                    }
                }

                setCopiedId(id);
                setTimeout(() => setCopiedId(null), 2500);
            };

            const copyAllReviews = () => {
                if (!data || !data.reviews || data.reviews.length === 0) return;
                const allReviewsText = data.reviews.map(r => {
                    let text = `"${r.review || ''}"\n— ${r.reviewer || 'Anonim'}${r.role ? ', ' + r.role : ''}`;
                    if (includeLinks && r.sourceUrl) {
                        text += `\nSumber: ${r.sourceUrl}`;
                    }
                    return text;
                }).join('\n\n');
                handleCopyText(allReviewsText, 'all-reviews');
            };

            // Fitur Baru: Salin Paket Lengkap Siap Posting ke Medsos
            const copyFullPackage = () => {
                if (!data) return;
                const title = data.exactTitle || selectedBook?.volumeInfo?.title || "Buku";
                const authors = data.exactAuthors || (selectedBook?.volumeInfo?.authors?.join(", ")) || "";
                
                let text = `📖 *${title}* ${authors ? '— ' + authors : ''}\n\n`;
                text += `✨ *Teaser / Hook:*\n${data.teaserStory}\n\n`;
                
                if (data.reviews && data.reviews.length > 0) {
                    text += `💬 *Apa Kata Mereka:*\n`;
                    data.reviews.forEach(r => {
                        text += `• "${r.review}"\n  — ${r.reviewer}${r.role ? ` (${r.role})` : ''}\n`;
                        if (includeLinks && r.sourceUrl) {
                            text += `  Sumber: ${r.sourceUrl}\n`;
                        }
                    });
                    text += `\n`;

                text += `🎨 *Prompt Poster Midjourney/DALL-E:*\n${getFullImagePrompt()}\n\n`;
                text += `#BookHook #RekomendasiBuku #BookLovers #${title.replace(/[^a-zA-Z0-9]/g, '')}`;

                handleCopyText(text.trim(), 'full-package');
            };

            const handleDownloadCover = async (url, title) => {
                if (!url || url.includes('No+Cover') || url.includes('placehold.co')) {
                    alert("Tidak ada gambar cover yang valid untuk diunduh.");
                    return;
                }
                const safeTitle = (title || 'Buku').replace(/[^a-zA-Z0-9_\-\s]/g, '').trim() || 'Cover';
                try {
                    const response = await fetch(url, { mode: 'cors' });
                    if (!response.ok) throw new Error("CORS atau HTTP error " + response.status);
                    const blob = await response.blob();
                    const blobUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = blobUrl;
                    a.download = `Cover - ${safeTitle}.jpg`;
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => {
                        window.URL.revokeObjectURL(blobUrl);
                        document.body.removeChild(a);
                    }, 200);
                } catch (error) {
                    console.warn("Fetch diblokir CORS, membuka di tab baru sebagai fallback.", error);
                    window.open(url, '_blank', 'noopener,noreferrer');
                }
            };

                setSearchQuery("");
                setSearchResults([]);

                let finalPrompt = data.imagePrompt;

                    finalPrompt += `, with elegant, cinematic typography text overlay integrated organically into the composition reading: ${selectedTexts}`;

                                                                target="_blank" 
                                                                rel="noopener noreferrer" 
                                                                className="text-blue-400 hover:text-blue-300 text-xs truncate hover:underline flex-1 break-all"
                                                            >
                                                                {rev.sourceUrl}
                                                            </a>
                                                        ) : (
                                                            <span className="text-xs text-slate-500 italic">Link tidak tersedia atau dari catatan publik</span>
                                                        )}
                                                    </li>
                                                ))
                                            ) : (
                                                <li className="text-xs italic text-slate-500">Tidak ada sumber yang tercatat.</li>
                                            )}
                                        </ul>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
